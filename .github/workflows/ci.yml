name: OpenBon CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./prisma/test.db"
      FISCAL_SALT: "ci-fiscal-salt-mindestens-16-zeichen"
      LICENSE_HMAC_SECRET: "ci-receipt-secret-mindestens-16"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Sync SQLite Test DB
        run: |
          npx prisma generate
          npx prisma db push --force-reset --accept-data-loss --skip-generate
          node prisma/seed.js

      - name: TypeScript Typecheck & Unit / Integration Tests
        run: npm test

      - name: Next.js Production Build
        run: npm run build
